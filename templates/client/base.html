    <script>
      // --- Utility: String to numeric seed ---
      function stringToSeed(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          hash = (hash << 5) - hash + str.charCodeAt(i);
          hash |= 0;
        }
        return Math.abs(hash);
      }

      // --- Seeded PRNG using Linear Congruential Generator ---
      function seededRandomGenerator(seed) {
        let m = 2 ** 31 - 1;
        let a = 16807;
        let state = seed % m;
        return function () {
          state = (a * state) % m;
          return state / m;
        };
      }

      // --- Generate ROI data with labels (dates) ---
      function generateSmoothSeededROI(
        seedString,
        startDate,
        days = 365,
        startROI = 0
      ) {
        const seed = stringToSeed(seedString);
        const random = seededRandomGenerator(seed);
        const data = [];
        const labels = [];
        let currentROI = startROI;

        const bias = 0.01; // very small daily positive bias
        const volatility = 0.1; // smaller daily volatility for smoothness
        const smoothingFactor = 0.3; // smooth factor for moving average

        let lastChange = 0;

        for (let i = 0; i < days; i++) {
          const date = new Date(startDate);
          date.setDate(date.getDate() + i);
          labels.push(date.toISOString().split("T")[0]);

          // Generate noisy daily change with bias
          let rawChange = (random() - 0.5) * volatility + bias;

          // Smooth changes: mix last day's change with current raw change
          const smoothedChange =
            smoothingFactor * rawChange + (1 - smoothingFactor) * lastChange;

          currentROI += smoothedChange;
          lastChange = smoothedChange;

          // Optional: clamp to prevent large negatives
          if (currentROI < -0.2) currentROI = -0.2;

          data.push(parseFloat(currentROI.toFixed(2)));
        }

        return {
          labels,
          data,
        };
      }

      // --- Store chart instances by canvas ID ---
      const roiCharts = {};

      // --- Create chart in canvas with given ID and seed ---
      function drawChart(selector, seedValue) {
        const { labels, data } = generateSmoothSeededROI(
          seedValue,
          "2025-01-01"
        );
        const canvases = document.querySelectorAll(selector);
        if (!canvases.length) {
          console.warn(`Canvas not found: ${selector}`);
          return;
        }

        canvases.forEach((canvas, idx) => {
          const ctx = canvas.getContext("2d");
          // Destroy existing chart instance if it exists
          if (roiCharts[selector + idx]) {
            roiCharts[selector + idx].destroy();
          }
          roiCharts[selector + idx] = new Chart(ctx, {
            type: "line",
            data: {
              labels: labels,
              datasets: [
                {
                  label: `ROI - ${seedValue}`,
                  data: data,
                  backgroundColor: "rgba(255, 159, 64, 0.2)",
                  borderColor: "rgba(255, 159, 64, 1)",
                  borderWidth: 1,
                  fill: true,
                  tension: 0.2,
                  pointRadius: 0,
                  pointHoverRadius: 4,
                },
              ],
            },
            options: {
              responsive: true,
              plugins: {
                legend: {
                  display: false,
                },
                title: {
                  display: false,
                },
                tooltip: {
                  enabled: true,
                },
              },
              interaction: {
                mode: "nearest",
                intersect: false,
              },
              scales: {
                x: {
                  display: false,
                  grid: {
                    display: false,
                  },
                  ticks: {
                    display: false,
                  },
                },
                y: {
                  display: false,
                  grid: {
                    display: false,
                  },
                  ticks: {
                    display: false,
                  },
                  beginAtZero: true,
                },
              },
            },
          });
        });
      }

      // --- Main logic: fetch experts and build UI + charts ---
      document.addEventListener("DOMContentLoaded", function () {
        fetch("https://api.Isotradex.com/api/top/experts")
          .then((response) => response.json())
          .then((data) => {
            function formatData(traders) {
              return traders
                .slice(0, 3)
                .map(
                  (trader) => `
                    <div class="card h-100 overflow-hidden">
                        <div class="card-body px-0 pb-0">
                            <div class="text-center position-relative">
                                <div class="vueRisk px-3 d-flex align-items-start justify-content-between">
                                    <p class="bTn mb-0 fs-12 fw-600 uppercase risk3">Risk 3</p>
                                    <a href="index.html#">
                                        <span class="circleImg d-inline-block mb-3">
                                            <img alt="${trader.name}" title="${
                    trader.name
                  }" loading="lazy" width="70" height="70" decoding="async" class="rounded-circle" src="https://www.isotradex.com/Home/${
                    trader.img
                  }" style="color: transparent;">
                                        </span>
                                    </a>
                                    <div class="d-flex align-items-center">
                                        <button class="inWatchList">⭐</button>
                                    </div>
                                </div>
                                <a href="index.html#">
                                    <div class="title">
                                        <h6 class="mb-1 fs-16">${
                                          trader.name
                                        }</h6>
                                        <div class="element d-flex align-items-center justify-content-center mb-3">
                                            <div class="me-2 d-flex align-items-center">
                                                <p class="moregray fs-12 mb-0 me-1">COPIERS</p>
                                                <p class="fs-12 medium mb-0">${
                                                  trader.copiers
                                                }</p>
                                            </div>
                                            <div class="d-flex align-items-center">
                                                <p class="moregray fs-12 mb-0 me-1">FOLLOWERS</p>
                                                <p class="fs-12 medium mb-0">${
                                                  trader.followers
                                                }</p>
                                            </div>
                                        </div>
                                        <div class="element">
                                            <p class="mb-0 px-1 fw-600 d-inline-flex greenView">+19.97</p>
                                        </div>
                                    </div>
                                </a>

                                <!-- Chart Canvas -->
                                <canvas class="${trader.name.replaceAll(
                                  " ",
                                  ""
                                )}_roiChart" height="100"></canvas>
                            </div>
                        </div>
                    </div>
                `
                )
                .join("");
            }

            // Populate slides
            const expertSlides = document.querySelectorAll(
              "#topExperts .swiper-slide"
            );
            const leaderSlides = document.querySelectorAll(
              "#topTraders .swiper-slide"
            );
            const topExperts = data.topExperts.slice(0, 3);
            const topLeaders = data.topLeaders.slice(0, 3);

            expertSlides.forEach((slide, idx) => {
              if (topExperts[idx]) {
                slide.innerHTML = formatData([topExperts[idx]]);
              }
            });

            leaderSlides.forEach((slide, idx) => {
              if (topLeaders[idx]) {
                slide.innerHTML = formatData([topLeaders[idx]]);
              }
            });

            setTimeout(() => {
              [...topExperts, ...topLeaders].forEach((trader) => {
                const canvasId = `.${trader.name.replaceAll(" ", "")}_roiChart`;
                drawChart(canvasId, trader.name.replaceAll(" ", ""));
              });
            }, 100);
          });
      });
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var htmlTag = document.documentElement;
        var storedTheme = localStorage.getItem("data-theme");
        var currentTheme;
        if (storedTheme) {
          htmlTag.setAttribute("data-theme", storedTheme);
          currentTheme = storedTheme;
        } else {
          var prefersLight = window.matchMedia(
            "(prefers-color-scheme: light)"
          ).matches;
          currentTheme = prefersLight ? "light" : "dark";
          htmlTag.setAttribute("data-theme", currentTheme);
        }

        document.querySelectorAll(".logo").forEach(function (el) {
          if (currentTheme === "dark") {
            el.src = el.getAttribute("data-dark-src");
          } else {
            el.src = el.getAttribute("data-light-src");
          }
        });
        // Set icon in .grayfade depending on theme
        document.querySelectorAll(".grayfade").forEach(function (el) {
          if (currentTheme === "dark") {
            el.innerHTML =
              '<i data-feather="sun" style="width:20px;color:#fff"></i>';
          } else {
            el.innerHTML = '<i data-feather="moon" style="width:20px"></i>';
          }
          if (window.feather) feather.replace();
        });

        document.querySelectorAll(".grayfade").forEach(function (el) {
          el.addEventListener("click", function () {
            var htmlTag = document.documentElement;
            var currentTheme = htmlTag.getAttribute("data-theme") || "dark";
            var newTheme = currentTheme === "dark" ? "light" : "dark";
            localStorage.setItem("data-theme", newTheme);
            location.reload();
          });
        });
      });
    </script>
    <script>
      // Toggle dropdown menus on click
      document
        .querySelectorAll(".nav-link.menuTitle#subDropdownMenuLink")
        .forEach(function (link) {
          link.addEventListener("click", function (e) {
            e.preventDefault();
            var parentLi = link.closest("li");
            var dropdown = parentLi
              ? parentLi.querySelector(".dropdown-menu")
              : null;
            if (dropdown) {
              dropdown.classList.toggle("show");
            }
          });
        });

      // Remove 'show' class on outside click
      document.addEventListener("click", function (e) {
        document
          .querySelectorAll(".dropdown-menu.show")
          .forEach(function (menu) {
            // Check if click is inside any open dropdown or its toggle link
            var parentLi = menu.closest("li");
            var toggleLink = parentLi
              ? parentLi.querySelector(
                  ".nav-link.menuTitle#subDropdownMenuLink"
                )
              : null;
            if (
              !menu.contains(e.target) &&
              !(toggleLink && toggleLink.contains(e.target))
            ) {
              menu.classList.remove("show");
            }
          });
      });

      // Toggle footer sections on mobile
      document.querySelectorAll(".forMobButton").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var parent = btn.parentElement;
          if (parent.classList.contains("false")) {
            parent.classList.remove("false");
            parent.classList.add("active");
          } else {
            parent.classList.remove("active");
            parent.classList.add("false");
          }
          var icon = btn.querySelector("i[data-feather]");
          if (icon) {
            if (icon.getAttribute("data-feather") === "plus-circle") {
              icon.setAttribute("data-feather", "minus-circle");
            } else {
              icon.setAttribute("data-feather", "plus-circle");
            }
            feather.replace();
          }
        });
      });

      document.querySelectorAll(".more-menu").forEach(function (menu) {
        menu.addEventListener("click", function (e) {
          e.preventDefault();
          var megaMenu = menu
            .closest(".repeatList")
            .querySelector(".megaMenusubList");
          if (megaMenu) {
            // menu.closest('.closemenuList').style.display = 'block'
            megaMenu.style.display = "block";
            megaMenu.style.right = "0";
          }
        });
      });

      // Hide megaMenusubList when closemenuList is clicked
      document
        .querySelectorAll(".closemenuList a")
        .forEach(function (closeBtn) {
          closeBtn.addEventListener("click", function (e) {
            e.preventDefault();
            var megaMenu = closeBtn.closest(".megaMenusubList");
            if (megaMenu) {
              megaMenu.style.display = "";
              megaMenu.style.right = "";
            }
          });
        });
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {

        function initOrDestroySwiper() {
          const isLargeScreen = window.innerWidth >= 769;
          if (isLargeScreen) {
            if (swiperInstance) {
              swiperInstance.destroy(true, true);
              swiperInstance = null;
            }
          } else {
            if (!swiperInstance) {
              swiperInstance = new Swiper(".swiper", {
                slidesPerView: 1.3,
                centeredSlides: false,
                spaceBetween: 10,
                loop: true,
                pagination: {
                  el: ".swiper-pagination",
                  clickable: true,
                },
                autoplay: true,
                breakpoints: {
                  768: {
                    slidesPerView: 2.2,
                    spaceBetween: 24,
                  },
                },
              });
            }
          }
        }
        initOrDestroySwiper();
        window.addEventListener("resize", initOrDestroySwiper);
      });
    </script>

    <script>
      AOS.init({
        duration: 1500,
        once: false,
      });
      document.addEventListener("DOMContentLoaded", () => {
        const elements = document.querySelectorAll(".aos-init");

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("aos-animate");
              } else {
                entry.target.classList.remove("aos-animate");
              }
            });
          },
          {
            threshold: 0.1,
          }
        );

        elements.forEach((el) => observer.observe(el));
      });
